<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1118">
<title>残響迷路</title>
<style>
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:radial-gradient(ellipse at 25% 0%,#162a36,transparent 55%),#0a1118;
  color:#eaf6fb;
  font:15px/1.65 system-ui,sans-serif;
  min-height:100vh
}
main {
  max-width:960px;
  margin:auto;
  padding:clamp(20px,5vw,60px) 20px
}
header {
  border-bottom:1px solid #324652;
  padding-bottom:18px;
  margin-bottom:24px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px
}
.mark {
  color:#75eddb;
  font:700 13px monospace;
  letter-spacing:.26em
}
h1 {
  font-size:clamp(36px,7vw,68px);
  letter-spacing:.08em;
  line-height:1.15;
  margin:8px 0 0
}
.stage {
  display:grid;
  grid-template-columns:minmax(0,1fr) 265px;
  gap:22px;
  align-items:start
}
.board {
  position:relative;
  border:1px solid #355462;
  border-radius:14px;
  overflow:hidden;
  background:#0c171f;
  padding:12px
}
canvas {
  display:block;
  width:100%;
  height:auto;
  border-radius:7px;
  touch-action:none
}
.panel {
  border:1px solid #324652;
  border-radius:14px;
  padding:18px;
  background:#111e28
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding-bottom:14px;
  border-bottom:1px solid #324652
}
.stats span {
  display:block;
  color:#afc5d0;
  font-size:11px
}
.stats strong {
  font:700 24px monospace;
  color:#75eddb
}
p {
  margin:13px 0
}
.help {
  color:#afc5d0;
  font-size:13px
}
.status {
  min-height:49px
}
button {
  font:inherit;
  font-weight:700;
  border:1px solid #456473;
  color:#eaf6fb;
  background:#1a303d;
  border-radius:8px;
  min-height:44px;
  cursor:pointer;
  touch-action:manipulation
}
button:focus-visible {
  outline:3px solid #ffd988;
  outline-offset:2px
}
button:disabled {
  opacity:.42;
  cursor:default
}
button:not(:disabled):hover {
  border-color:#75eddb
}
.primary {
  display:block;
  width:100%;
  background:#75eddb;
  color:#09221e;
  border-color:#75eddb
}
.secondary {
  margin-top:8px;
  width:100%
}
.keys {
  display:grid;
  grid-template-columns:repeat(3,44px);
  gap:5px;
  justify-content:center;
  margin:15px 0 0
}
.up {
  grid-column:2
}
.left {
  grid-column:1
}
.legend {
  display:flex;
  gap:16px;
  color:#afc5d0;
  font-size:12px;
  margin:9px 2px 0
}
.legend b {
  color:#75eddb
}
.legend span:last-child b {
  color:#ffd988
}
footer {
  margin-top:20px;
  color:#afc5d0;
  font-size:13px
}
@media(max-width:660px) {
  .stage {
    grid-template-columns:1fr;
    gap:12px
  }
  .board {
    max-width:470px;
    margin:auto;
    width:100%
  }
  header {
    margin-bottom:12px;
    padding-bottom:12px
  }
  .panel {
    padding:12px
  }
  .status {
    min-height:0
  }
  .keys {
    margin-top:10px
  }
  main {
    padding-top:15px
  }
}
</style>
<main>
<header>
<div>
<div class="mark">ECHO MAZE</div>
<h1>残響迷路</h1>
</div>
</header>
<div class="stage">
<section aria-label="迷路">
<div class="board">
<canvas id="maze" width="540" height="540" aria-label="ミント色の丸が現在地、金色のひし形が出口">
</canvas>
</div>
<div class="legend">
<span>
<b>●</b> 現在地</span>
<span>
<b>◆</b> 出口</span>
</div>
</section>
<section class="panel" aria-label="操作と記録">
<div class="stats">
<div>
<span>ステージ</span>
<strong id="level">01</strong>
</div>
<div>
<span>歩数</span>
<strong id="steps">0</strong>
</div>
<div>
<span>残りエコー</span>
<strong id="echoes">2</strong>
</div>
</div>
<p id="status" class="status" role="status">迷路を覚えて、光が消えたら出口へ。</p>
<button id="start" class="primary">ゲーム開始</button>
<button id="echo" class="secondary" disabled>エコーを使う · Space</button>
<div class="keys" aria-label="方向ボタン">
<button class="up" data-dir="0" aria-label="上">↑</button>
<button class="left" data-dir="3" aria-label="左">←</button>
<button data-dir="2" aria-label="下">↓</button>
<button data-dir="1" aria-label="右">→</button>
</div>
<p class="help">矢印キー / WASD / 方向ボタンで移動。エコーを使うと壁が一瞬見える。</p>
</section>
</div>
<footer>最初の5秒で道を覚えよう。クリアすると、迷路が広がる。</footer>
</main>
<script>
const byId = id => document.getElementById(id);
const canvas = byId('maze');
const ctx = canvas.getContext('2d');
const directions = [[0,-1],[1,0],[0,1],[-1,0]];
let level = 1, size, walls, player, exit, steps, echoes;
let phase = 'ready', revealUntil = 0, bumpUntil = 0, bumpDirection, frame = 0;
function generateMaze(width) {
  const cells = Array(width * width).fill(15);
  const visited = new Set([0]);
  const stack = [0];
  while (stack.length) {
    const current = stack.at(-1);
    const options = directions.map(([dx,dy], dir) => {
      const x = current % width + dx, y = Math.floor(current / width) + dy;
      return {dir, next: x + y * width, inside: x >= 0 && y >= 0 && x < width && y < width};
    }).filter(option => option.inside && !visited.has(option.next));
    if (!options.length) { stack.pop(); continue; }
    const {dir,next} = options[Math.floor(Math.random() * options.length)];
    cells[current] &= ~(1 << dir);
    cells[next] &= ~(1 << ((dir + 2) % 4));
    stack.push(next);
    visited.add(next);
  }
  return cells;
}
function prepare() {
  size = Math.min(4 + level, 10);
  walls = generateMaze(size);
  player = 0;
  exit = size * size - 1;
  steps = 0;
  echoes = 2;
  revealUntil = bumpUntil = 0;
  updateStats();
}
function updateStats() {
  byId('level').textContent = String(level).padStart(2,'0');
  byId('steps').textContent = steps;
  byId('echoes').textContent = echoes;
  byId('echo').disabled = phase !== 'play' || !echoes || performance.now() < revealUntil;
}
function start() {
  if (phase === 'won') { level++; prepare(); }
  phase = 'memorize';
  revealUntil = performance.now() + 5000;
  byId('start').disabled = true;
  byId('start').textContent = '迷路を覚えよう';
  updateStats();
  draw();
}
function echo() {
  if (phase !== 'play' || !echoes || performance.now() < revealUntil) return;
  echoes--;
  revealUntil = performance.now() + 1300;
  byId('status').textContent = '壁が浮かび上がった！';
  updateStats();
  byId('echo').disabled = true;
  draw();
}
function move(dir) {
  if (phase !== 'play') return;
  if (walls[player] & (1 << dir)) {
    bumpUntil = performance.now() + 350;
    bumpDirection = dir;
    byId('status').textContent = '壁にぶつかった。';
  } else {
    const [dx,dy] = directions[dir];
    player += dx + dy * size;
    steps++;
    byId('status').textContent = '金色の出口を目指そう。';
    if (player === exit) {
      phase = 'won';
      byId('status').textContent = steps + '歩で脱出成功！';
      byId('start').disabled = false;
      byId('start').textContent = '次のステージ';
    }
    updateStats();
  }
  draw();
}
function draw(now = performance.now()) {
  cancelAnimationFrame(frame);
  if (phase === 'memorize') {
    if (now >= revealUntil) {
      phase = 'play';
      byId('start').textContent = '探索中';
      byId('status').textContent = '金色の出口を目指そう。';
      updateStats();
    } else {
      byId('status').textContent = '壁が消えるまで ' + Math.ceil((revealUntil - now) / 1000) + ' 秒';
    }
  }
  if (phase === 'play' && revealUntil && now >= revealUntil) {
    revealUntil = 0;
    if (byId('status').textContent === '壁が浮かび上がった！') byId('status').textContent = '金色の出口を目指そう。';
    updateStats();
  }
  const visible = phase !== 'play' || now < revealUntil;
  const unit = 500 / size;
  ctx.fillStyle = '#0a151d';
  ctx.fillRect(0,0,540,540);
  for (let i = 0; i < walls.length; i++) {
    const x = 20 + i % size * unit, y = 20 + Math.floor(i / size) * unit;
    ctx.fillStyle = (i % size + Math.floor(i / size)) % 2 ? '#10222c' : '#142934';
    ctx.fillRect(x,y,unit,unit);
    const corners = [[x,y],[x+unit,y],[x+unit,y+unit],[x,y+unit]];
    for (let dir = 0; dir < 4; dir++) {
      const outside = (dir === 0 && i < size) || (dir === 1 && i % size === size - 1) ||
        (dir === 2 && i >= size * (size - 1)) || (dir === 3 && i % size === 0);
      const bump = now < bumpUntil && i === player && dir === bumpDirection;
      if (!(walls[i] & (1 << dir)) || !(visible || outside || bump)) continue;
      ctx.strokeStyle = bump ? '#ff8e87' : '#59929e';
      ctx.lineWidth = bump ? 6 : 3;
      ctx.beginPath();
      ctx.moveTo(...corners[dir]);
      ctx.lineTo(...corners[(dir+1)%4]);
      ctx.stroke();
    }
  }
  const center = i => [20 + (i % size + .5) * unit, 20 + (Math.floor(i / size) + .5) * unit];
  const [ex,ey] = center(exit);
  ctx.save();
  ctx.translate(ex,ey);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle = ctx.shadowColor = '#ffd988';
  ctx.shadowBlur = 20;
  ctx.fillRect(-unit*.13,-unit*.13,unit*.26,unit*.26);
  ctx.restore();
  const [px,py] = center(player);
  ctx.save();
  ctx.fillStyle = ctx.shadowColor = '#75eddb';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(px,py,unit*.17,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  if (phase === 'memorize' || now < revealUntil || now < bumpUntil) frame = requestAnimationFrame(draw);
}
byId('start').addEventListener('click',start);
byId('echo').addEventListener('click',echo);
document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('click',() => move(Number(button.dataset.dir))));
const keys = new Map([['arrowup',0],['w',0],['arrowright',1],['d',1],['arrowdown',2],['s',2],['arrowleft',3],['a',3]]);
window.addEventListener('keydown',event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.code === 'Space' && phase === 'play' && event.target.tagName !== 'BUTTON') {
    event.preventDefault();
    if (!event.repeat) echo();
    return;
  }
  const dir = keys.get(event.key.toLowerCase());
  if (dir === undefined) return;
  event.preventDefault();
  move(dir);
});
prepare();
draw();
</script>
</html>
