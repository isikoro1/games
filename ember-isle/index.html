<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151d30">
  <title>EMBER ISLE — 灯りの島</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #151d30; color: #f6e7c9; font-family: system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .hud { position: fixed; inset: 0; pointer-events: none; padding: max(24px, env(safe-area-inset-top)) 24px; }
    header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    h1 { font: 800 22px/1.1 system-ui; letter-spacing: .06em; margin: 0 0 6px; }
    .subtitle { color: #c2b8ae; font-size: 13px; }
    .counter { border: 1px solid #f6e7c933; background: #151d30b8; border-radius: 12px; padding: 10px 16px; font-size: 18px; }
    .objective { position: absolute; top: 105px; left: 24px; margin: 0; color: #d5d0c4; font-size: 14px; }
    .help { position: absolute; bottom: 30px; left: 24px; font-size: 13px; color: #d5d0c4; line-height: 1.8; }
    button { font: inherit; cursor: pointer; color: #f6e7c9; background: #17253cbb; border: 1px solid #f6e7c944; border-radius: 12px; min-height: 48px; min-width: 48px; touch-action: none; }
    button:focus-visible { outline: 3px solid #ffd486; outline-offset: 3px; }
    .restart { pointer-events: auto; position: absolute; top: 83px; right: 24px; font-size: 13px; padding: 0 14px; }
    .pad { pointer-events: auto; position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 24px; display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
    .pad button { font-size: 14px; }
    .pad button:first-child { grid-column: 2; }
    .pad button:nth-child(2) { grid-column: 1; }
    .rotate { pointer-events: auto; position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); right: 24px; display: flex; gap: 7px; }
    .rotate button { padding: 0 14px; }
    .modal { position: fixed; inset: 0; display: grid; place-items: center; background: #10172c55; padding: 22px; }
    .modal[hidden] { display: none; }
    .card { max-width: 400px; width: 100%; padding: 30px; background: #172337ed; border: 1px solid #f6e7c944; border-radius: 20px; box-shadow: 0 25px 100px #0005; }
    .card h2 { font-size: 30px; margin: 0 0 12px; }
    .card p { color: #c9c7c2; line-height: 1.9; font-size: 15px; }
    .card button { width: 100%; margin-top: 12px; background: #f4c985; color: #242433; font-weight: 800; border: 0; }
    @media (min-width: 800px) { .pad { display: none; } }
    @media (max-width: 799px) { .help { bottom: 150px; font-size: 12px; } h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <canvas id="world" aria-label="夜の島を歩いて光る欠片を集める3Dゲーム"></canvas>
  <div class="hud">
    <header><div><h1>EMBER ISLE</h1><div class="subtitle">灯りの島</div></div><div class="counter" id="count" aria-live="polite">欠片 0 / 5</div></header>
    <p class="objective" id="objective">光る欠片を5つ集めて、中央の灯台へ。</p>
    <button class="restart" id="restart">最初から</button>
    <div class="help">WASD / 矢印キーで移動<br>Q・E / 下のボタンで視点を回す</div>
    <div class="pad" aria-label="移動"><button data-key="w" aria-label="前進">前</button><button data-key="a" aria-label="左へ">左</button><button data-key="s" aria-label="後退">後</button><button data-key="d" aria-label="右へ">右</button></div>
    <div class="rotate"><button data-key="q" aria-label="視点を左回転">左回転</button><button data-key="e" aria-label="視点を右回転">右回転</button></div>
  </div>
  <div class="modal" id="intro"><section class="card"><h2>夜の島に、灯りを。</h2><p>小さな旅人を動かして、島に散らばる光の欠片を5つ集めよう。すべて集めたら、中央の灯台へ。<br>欠片は近づくと拾えます。</p><button id="start">島を歩く</button></section></div>
  <div class="modal" id="win" hidden><section class="card"><h2>灯りが、ともった。</h2><p id="result"></p><button id="again">もう一度歩く</button></section></div>
  <script>
    // World coordinates use y as height. All geometry is projected to a small
    // Canvas, then enlarged without smoothing for a pixel-art appearance.
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const keys = new Set();
    const player = { x: 0, z: -6 };
    const shardLocations = [[-7,-5],[7,-4],[-6,5],[7,6],[0,9]];
    const trees = [[-8,-2],[-5,-7],[4,-8],[9,0],[-9,4],[-3,8],[4,8],[-6,2],[5,2],[2,-5]];
    const rocks = [[-9,-5],[8,3],[3,6],[-3,-4]];
    let shards, yaw, active = false, completed = false, elapsed = 0;
    let previousTime = null, polygons = [], camera;
    const pitch = .62;
    const palette = { grass: [56,92,80], sand: [129,120,94], trunk: [94,66,65] };

    function reset() {
      player.x = 0; player.z = -6;
      shards = shardLocations.map(([x,z]) => ({ x, z, taken: false }));
      yaw = 0; elapsed = 0; completed = false; keys.clear();
      document.getElementById("count").textContent = "欠片 0 / 5";
      document.getElementById("objective").textContent = "光る欠片を5つ集めて、中央の灯台へ。";
      document.getElementById("win").hidden = true;
    }

    function start() {
      reset(); active = true;
      document.getElementById("intro").hidden = true;
    }

    function resize() {
      const aspect = innerWidth / innerHeight;
      canvas.height = 270;
      canvas.width = Math.max(200, Math.min(640, Math.round(270 * aspect)));
    }

    // Transform world vertices into camera space. Faces crossing the near plane
    // are skipped; the camera stays well above the small playable island.
    function project([x,y,z]) {
      const dx = x - camera.x, dy = y - camera.y, dz = z - camera.z;
      const right = dx * Math.cos(yaw) - dz * Math.sin(yaw);
      const forward = dx * Math.sin(yaw) + dz * Math.cos(yaw);
      const depth = forward * Math.cos(pitch) - dy * Math.sin(pitch);
      const up = dy * Math.cos(pitch) + forward * Math.sin(pitch);
      if (depth < .3) return null;
      const scale = canvas.height * 1.05 / depth;
      return [canvas.width / 2 + right * scale, canvas.height * .48 - up * scale, depth];
    }

    function face(points, color) {
      const screen = points.map(project);
      if (screen.some(point => point === null)) return;
      const depth = screen.reduce((sum,p) => sum + p[2], 0) / screen.length;
      const fog = Math.min(.68, Math.max(0, (depth - 12) / 40));
      const sky = [34,43,66];
      const shaded = color.map((value,index) => Math.round(value * (1-fog) + sky[index] * fog));
      polygons.push({ screen, depth, color: "rgb(" + shaded.join(",") + ")" });
    }

    function box(x,y,z,w,h,d,color) {
      const a=[x-w/2,y,z-d/2], b=[x+w/2,y,z-d/2];
      const c=[x+w/2,y,z+d/2], e=[x-w/2,y,z+d/2];
      const lift = p => [p[0],p[1]+h,p[2]];
      const tint = amount => color.map(value => Math.min(255,Math.round(value*amount)));
      face([a,b,lift(b),lift(a)],tint(.72));
      face([b,c,lift(c),lift(b)],tint(.86));
      face([c,e,lift(e),lift(c)],tint(.65));
      face([e,a,lift(a),lift(e)],tint(.8));
      face([lift(a),lift(b),lift(c),lift(e)],tint(1.18));
    }

    function pyramid(x,y,z,radius,height,color,rotation=0) {
      const ring = Array.from({length:4},(_,i) => {
        const angle = rotation + i * Math.PI/2;
        return [x+Math.cos(angle)*radius,y,z+Math.sin(angle)*radius];
      });
      for (let i=0;i<4;i++) {
        face([ring[i],ring[(i+1)%4],[x,y+height,z]],color.map(v=>Math.round(v*(.7+i*.09))));
      }
    }

    function canWalk(x,z) {
      if (Math.hypot(x,z) > 10.8) return false;
      if (Math.abs(x)<.95 && Math.abs(z)<.95) return false;
      return !trees.some(([tx,tz])=>Math.hypot(x-tx,z-tz)<.48);
    }

    // Move relative to camera yaw. Delta is capped so a resumed tab cannot
    // teleport the player or collect a distant shard.
    function update(dt) {
      if (!active || completed) return;
      elapsed += dt;
      yaw += ((keys.has("e")?1:0)-(keys.has("q")?1:0))*dt*1.6;
      let forward = (keys.has("w")?1:0)-(keys.has("s")?1:0);
      let side = (keys.has("d")?1:0)-(keys.has("a")?1:0);
      const length = Math.hypot(forward,side);
      if (length) {
        forward /= length; side /= length;
        const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*3.3;
        const dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*dt*3.3;
        if (canWalk(player.x+dx,player.z)) player.x+=dx;
        if (canWalk(player.x,player.z+dz)) player.z+=dz;
      }
      for (const shard of shards) {
        if (!shard.taken && Math.hypot(player.x-shard.x,player.z-shard.z)<1) shard.taken=true;
      }
      const count=shards.filter(shard=>shard.taken).length;
      document.getElementById("count").textContent="欠片 "+count+" / 5";
      if (count===5) {
        document.getElementById("objective").textContent="中央の灯台へ戻ろう。";
        if (Math.hypot(player.x,player.z)<1.8) {
          completed=true; keys.clear();
          document.getElementById("result").textContent=Math.floor(elapsed/60)+"分"+Math.floor(elapsed%60)+"秒で島に灯りを取り戻した。少し、この夜を眺めていこう。";
          document.getElementById("win").hidden=false;
        }
      }
    }

    function render(time) {
      const w=canvas.width, h=canvas.height;
      camera={x:player.x-Math.sin(yaw)*14,y:11,z:player.z-Math.cos(yaw)*14};
      const sky=ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0,"#151d35"); sky.addColorStop(.5,"#474759"); sky.addColorStop(1,"#293f52");
      ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
      ctx.fillStyle="#e6c9a1"; ctx.fillRect(w*.77,25,15,15);
      for(let i=0;i<35;i++) {
        ctx.fillStyle=i%3===0?"#bcaaa0":"#697789";
        ctx.fillRect((i*73+31)%w,(i*31+7)%75,1,1);
      }
      polygons=[];
      // Water, terrain and objects use separate layers before depth sorting.
      for(let z=-22;z<24;z+=4) for(let x=-24;x<25;x+=4) {
        const wave=Math.sin(x*.4+z*.6+time*.6)*4;
        face([[x,-.65,z],[x+4,-.65,z],[x+4,-.65,z+4],[x,-.65,z+4]],[31+wave,57+wave,72+wave]);
      }
      const water = polygons;
      polygons = [];
      for(let z=-12;z<12;z+=2) for(let x=-12;x<12;x+=2) {
        const r=Math.hypot(x+1,z+1);
        if(r>12) continue;
        const base=r>9.7?palette.sand:palette.grass;
        const shade=((x*17+z*13+1000)%7)*2;
        const a=[x,0,z], b=[x+2,0,z], c=[x+2,0,z+2], d=[x,0,z+2];
        face([a,b,c],base.map(v=>v+shade));
        face([a,c,d],base.map(v=>v+shade-5));
      }
      const terrain = polygons;
      polygons = [];
      for(const [x,z] of trees) {
        box(x,0,z,.3,1.1,.3,palette.trunk);
        pyramid(x,.65,z,1.15,2.6,[48,100,88],.4);
        pyramid(x,1.6,z,.85,1.9,[62,120,100],.4);
      }
      for(const [x,z] of rocks) pyramid(x,0,z,.7,.7,[106,110,119],.3);
      // The lighthouse changes color once all shards have been delivered.
      box(0,0,0,1.2,2.7,1.2,[170,159,143]);
      box(0,2.7,0,1.5,.55,1.5,completed?[255,213,118]:[87,124,133]);
      pyramid(0,3.25,0,1.2,.65,[133,88,83],Math.PI/4);
      for(const shard of shards) {
        if(shard.taken) continue;
        const y=1+Math.sin(time*2+shard.x)*.15;
        pyramid(shard.x,y,shard.z,.32,.7,[255,218,129],time*.7);
        pyramid(shard.x,y,shard.z,.32,-.5,[229,162,103],time*.7);
      }
      // A tiny block-built traveler, with a bob only while walking.
      const moving=["w","a","s","d"].some(key=>keys.has(key));
      const bob=moving&&active&&!completed?Math.sin(time*12)*.045:0;
      box(player.x,.08,player.z,.42,.3,.35,[48,49,62]);
      box(player.x,.35+bob,player.z,.55,.6,.4,[218,126,88]);
      box(player.x,.95+bob,player.z,.48,.44,.45,[238,202,153]);
      box(player.x,1.36+bob,player.z,.64,.12,.6,[112,76,67]);
      // Water is always below land. Sort objects independently so large water
      // faces cannot cover nearer terrain just because their centers are closer.
      const backToFront = (a,b) => b.depth-a.depth;
      const ordered = [...water.sort(backToFront), ...terrain.sort(backToFront), ...polygons.sort(backToFront)];
      for(const polygon of ordered) {
        ctx.beginPath();
        polygon.screen.forEach(([x,y],index)=>index?ctx.lineTo(x,y):ctx.moveTo(x,y));
        ctx.closePath(); ctx.fillStyle=polygon.color; ctx.fill();
      }
      // Sparse screen-space grain is deterministic and costs no image download.
      ctx.fillStyle="#0a142017";
      for(let i=0;i<160;i++) ctx.fillRect((i*97)%w,(i*53)%h,1,1);
    }

    function frame(now) {
      const dt=previousTime===null?0:Math.min((now-previousTime)/1000,.05);
      previousTime=now;
      if(!document.hidden) { update(dt); render(now/1000); }
      requestAnimationFrame(frame);
    }

    const aliases={arrowup:"w",arrowdown:"s",arrowleft:"a",arrowright:"d"};
    document.addEventListener("keydown",event=>{
      if(event.ctrlKey||event.altKey||event.metaKey) return;
      const key=aliases[event.key.toLowerCase()]||event.key.toLowerCase();
      if(!"wasdqe".includes(key)||key.length!==1) return;
      event.preventDefault(); keys.add(key);
    });
    document.addEventListener("keyup",event=>keys.delete(aliases[event.key.toLowerCase()]||event.key.toLowerCase()));
    window.addEventListener("blur",()=>keys.clear());
    document.addEventListener("visibilitychange",()=>{keys.clear();previousTime=null;});
    for(const button of document.querySelectorAll("[data-key]")) {
      button.addEventListener("pointerdown",event=>{
        event.preventDefault(); button.setPointerCapture(event.pointerId); keys.add(button.dataset.key);
      });
      const release=()=>keys.delete(button.dataset.key);
      button.addEventListener("pointerup",release);
      button.addEventListener("pointercancel",release);
      button.addEventListener("lostpointercapture",release);
    }
    document.getElementById("start").addEventListener("click",start);
    document.getElementById("again").addEventListener("click",start);
    document.getElementById("restart").addEventListener("click",start);
    window.addEventListener("resize",resize);
    reset(); resize(); requestAnimationFrame(frame);
  </script>
</body>
</html>
